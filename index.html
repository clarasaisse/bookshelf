<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #f7f3ea;
    --tinta: #2b2622;
    --suave: #7a6f64;
    --borda: #e3dccd;
    --acento: #9c4a2f;
    --acento-claro: #f3e4dc;
    --card: #fffdf8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--papel);
    color: var(--tinta);
    min-height: 100vh;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }

  header { margin-bottom: 28px; }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 2.2rem;
    margin: 0 0 4px;
    letter-spacing: -0.5px;
  }

  .subtitulo {
    color: var(--suave);
    margin: 0;
    font-size: 0.95rem;
  }

  .resumo {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }

  .resumo div {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 14px;
  }

  .resumo strong {
    display: block;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.6rem;
    color: var(--acento);
  }

  .resumo span {
    font-size: 0.8rem;
    color: var(--suave);
  }

  .busca {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(43, 38, 34, 0.04);
  }

  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: #fff;
    color: var(--tinta);
    outline: none;
  }

  input:focus {
    border-color: var(--acento);
    box-shadow: 0 0 0 3px var(--acento-claro);
  }

  .botoes {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  button {
    flex: 1;
    padding: 13px 14px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.05s, background 0.2s;
  }

  button:active { transform: scale(0.98); }

  #buscar {
    background: var(--acento);
    color: #fff;
    border: none;
  }

  #buscar:hover { background: #843d27; }

  #reenviar {
    background: transparent;
    color: var(--acento);
    border: 1px solid var(--acento);
  }

  #reenviar:hover { background: var(--acento-claro); }

  #status {
    min-height: 1.4em;
    font-size: 0.9rem;
    color: var(--suave);
    margin: 0 0 20px 4px;
  }

  #lista {
    display: grid;
    gap: 12px;
  }

  .livro {
    background: var(--card);
    border: 1px solid var(--borda);
    border-left: 4px solid var(--acento);
    border-radius: 14px;
    padding: 16px 18px;
  }

  .livro h3 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0 0 4px;
    line-height: 1.3;
  }

  .livro .autor {
    margin: 0 0 10px;
    color: var(--suave);
    font-size: 0.9rem;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    font-size: 0.75rem;
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: 999px;
    padding: 3px 10px;
    color: var(--tinta);
  }

  .vazio {
    text-align: center;
    color: var(--suave);
    padding: 32px 0;
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.8rem; }
    .botoes { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Minha biblioteca</h1>
    <p class="subtitulo">Digite o ISBN de um livro para cadastrá-lo.</p>
    <div class="resumo">
      <div><strong id="totalLivros">0</strong><span>livros</span></div>
      <div><strong id="totalPaises">0</strong><span>países de autores</span></div>
    </div>
  </header>

  <section class="busca">
    <input id="isbnInput" type="text" inputmode="numeric" placeholder="ISBN (10 ou 13 dígitos)">
    <div class="botoes">
      <button id="buscar">Buscar e cadastrar</button>
      <button id="reenviar">Enviar pendentes</button>
    </div>
  </section>

  <p id="status"></p>

  <div id="lista"></div>
</div>

<script>
// Cole aqui o URL do app da web do Apps Script
const URL_PLANILHA = 'COLE_AQUI_O_URL_DO_APP_DA_WEB';

const statusEl = document.getElementById('status');
const lista = document.getElementById('lista');
const campo = document.getElementById('isbnInput');
let catalogo = JSON.parse(localStorage.getItem('catalogo') || '[]');

// ---------- ISBN ----------

function isbn13Valido(isbn) {
  if (!/^\d{13}$/.test(isbn)) return false;
  let soma = 0;
  for (let i = 0; i < 12; i++) soma += Number(isbn[i]) * (i % 2 === 0 ? 1 : 3);
  return (10 - (soma % 10)) % 10 === Number(isbn[12]);
}

function isbn10Para13(isbn9) {
  const base = '978' + isbn9;
  let soma = 0;
  for (let i = 0; i < 12; i++) soma += Number(base[i]) * (i % 2 === 0 ? 1 : 3);
  return base + ((10 - (soma % 10)) % 10);
}

function paisDaEditora(isbn) {
  const prefixos = [
    ['97885', 'Brasil'], ['97865', 'Brasil'],
    ['978972', 'Portugal'], ['978989', 'Portugal'],
    ['97884', 'Espanha'], ['97888', 'Itália'],
    ['9782', 'França'], ['9783', 'Alemanha'],
    ['9784', 'Japão'], ['9787', 'China']
  ];
  for (const [prefixo, pais] of prefixos) {
    if (isbn.startsWith(prefixo)) return pais;
  }
  return '';
}

// ---------- Busca do livro ----------

async function buscarLivro(isbn) {
  try {
    const r = await fetch(`https://brasilapi.com.br/api/isbn/v1/${isbn}`);
    if (r.ok) {
      const info = await r.json();
      return {
        isbn,
        titulo: info.title || '',
        autores: (info.authors || []).join(', '),
        editora: info.publisher || '',
        ano: String(info.year || ''),
        paginas: info.page_count || ''
      };
    }
  } catch (e) { /* tenta a próxima fonte */ }

  try {
    const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    if (r.ok) {
      const dados = await r.json();
      const info = dados[`ISBN:${isbn}`];
      if (info) {
        return {
          isbn,
          titulo: info.title || '',
          autores: (info.authors || []).map(a => a.name).join(', '),
          editora: (info.publishers || []).map(p => p.name).join(', '),
          ano: ((info.publish_date || '').match(/\d{4}/) || [''])[0],
          paginas: info.number_of_pages || ''
        };
      }
    }
  } catch (e) { /* nada encontrado */ }

  return null;
}

// ---------- País do autor (Wikidata) ----------

async function consultaWikidata(url) {
  return (await fetch(url + '&origin=*')).json();
}

async function entidade(id, props) {
  const dados = await consultaWikidata(
    `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${id}&props=${props}&languages=pt|en&format=json`
  );
  return dados.entities[id];
}

function rotulo(entidadeWikidata) {
  const l = entidadeWikidata.labels || {};
  return (l.pt || l.en || {}).value || '';
}

async function paisDoAutor(nome) {
  if (!nome) return '';
  try {
    const busca = await consultaWikidata(
      `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(nome)}&language=en&type=item&limit=5&format=json`
    );
    for (const item of busca.search || []) {
      const autor = await entidade(item.id, 'claims');
      const claims = autor.claims || {};
      if (!claims.P27 && !claims.P19) continue;

      if (claims.P19) {
        const lugar = await entidade(claims.P19[0].mainsnak.datavalue.value.id, 'claims');
        if (lugar.claims?.P17) {
          const idPais = lugar.claims.P17[0].mainsnak.datavalue.value.id;
          const nomePais = rotulo(await entidade(idPais, 'labels'));
          if (nomePais) return nomePais;
        }
      }
      if (claims.P27) {
        const idPais = claims.P27[0].mainsnak.datavalue.value.id;
        return rotulo(await entidade(idPais, 'labels'));
      }
    }
  } catch (e) { /* sem resultado */ }
  return '';
}

// ---------- Planilha e lista ----------

async function enviarParaPlanilha(livro) {
  try {
    await fetch(URL_PLANILHA, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(livro)
    });
  } catch (e) {
    console.error('Falha ao enviar para a planilha', e);
  }
}

function atualizarResumo() {
  document.getElementById('totalLivros').textContent = catalogo.length;
  const paises = new Set(catalogo.map(l => l.paisAutor).filter(Boolean));
  document.getElementById('totalPaises').textContent = paises.size;
}

function criarChip(texto) {
  const span = document.createElement('span');
  span.className = 'chip';
  span.textContent = texto;
  return span;
}

function mostrarLista() {
  lista.innerHTML = '';
  atualizarResumo();

  if (!catalogo.length) {
    const p = document.createElement('p');
    p.className = 'vazio';
    p.textContent = 'Nenhum livro cadastrado ainda.';
    lista.appendChild(p);
    return;
  }

  catalogo.slice().reverse().forEach(l => {
    const card = document.createElement('article');
    card.className = 'livro';

    const h3 = document.createElement('h3');
    h3.textContent = l.titulo;

    const autor = document.createElement('p');
    autor.className = 'autor';
    autor.textContent = [l.autores, l.ano].filter(Boolean).join(' · ');

    const chips = document.createElement('div');
    chips.className = 'chips';
    if (l.paisAutor) chips.appendChild(criarChip(l.paisAutor));
    if (l.editora) chips.appendChild(criarChip(l.editora));
    if (l.paginas) chips.appendChild(criarChip(`${l.paginas} págs.`));

    card.append(h3, autor, chips);
    lista.appendChild(card);
  });
}

// ---------- Fluxo principal ----------

async function processarIsbn(isbn) {
  if (!isbn13Valido(isbn)) {
    statusEl.textContent = 'ISBN inválido. Confira os dígitos.';
    return;
  }
  if (catalogo.some(l => l.isbn === isbn)) {
    statusEl.textContent = 'Este livro já está no catálogo.';
    return;
  }

  statusEl.textContent = `Buscando ${isbn}...`;
  const livro = await buscarLivro(isbn);

  if (!livro) {
    statusEl.textContent = `ISBN ${isbn} não encontrado nas bases consultadas.`;
    return;
  }

  statusEl.textContent = 'Buscando país do autor...';
  livro.paisAutor = await paisDoAutor(livro.autores.split(',')[0].trim());
  livro.paisPublicacao = paisDaEditora(isbn);

  await enviarParaPlanilha(livro);
  livro.enviado = true;

  catalogo.push(livro);
  localStorage.setItem('catalogo', JSON.stringify(catalogo));
  statusEl.textContent = `Cadastrado: ${livro.titulo}`;
  mostrarLista();
}

function cadastrarDigitado() {
  let isbn = campo.value.replace(/[^0-9Xx]/g, '').toUpperCase();
  if (isbn.length === 10) isbn = isbn10Para13(isbn.slice(0, 9));
  campo.value = '';
  processarIsbn(isbn);
}

document.getElementById('buscar').onclick = cadastrarDigitado;

campo.addEventListener('keydown', e => {
  if (e.key === 'Enter') cadastrarDigitado();
});

document.getElementById('reenviar').onclick = async () => {
  const pendentes = catalogo.filter(l => !l.enviado);
  if (!pendentes.length) {
    statusEl.textContent = 'Nenhum livro pendente.';
    return;
  }
  statusEl.textContent = `Enviando ${pendentes.length} livro(s)...`;
  for (const livro of pendentes) {
    await enviarParaPlanilha(livro);
    livro.enviado = true;
    localStorage.setItem('catalogo', JSON.stringify(catalogo));
    await new Promise(r => setTimeout(r, 500));
  }
  statusEl.textContent = 'Envio concluído. Confira a planilha.';
};

mostrarLista();
</script>
</body>
</html>
