<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --papel: #f7f3ea;
    --tinta: #2b2622;
    --suave: #7a6f64;
    --borda: #e3dccd;
    --acento: #9c4a2f;
    --acento-claro: #f3e4dc;
    --card: #fffdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--papel);
    color: var(--tinta);
  }
  .container { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 2rem;
    margin: 0 0 4px;
  }
  .subtitulo { color: var(--suave); margin: 0 0 18px; font-size: 0.95rem; }
  .resumo { display: flex; gap: 12px; margin-bottom: 18px; }
  .resumo div {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .resumo strong {
    display: block;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.5rem;
    color: var(--acento);
  }
  .resumo span { font-size: 0.8rem; color: var(--suave); }

  #mapa {
    height: 380px;
    border: 1px solid var(--borda);
    border-radius: 16px;
    background: #dfe9ef;
    margin-bottom: 18px;
  }

  .busca {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
  }
  input {
    width: 100%;
    padding: 13px 15px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid var(--borda);
    border-radius: 12px;
    background: #fff;
    outline: none;
  }
  input:focus { border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-claro); }
  .botoes { display: flex; gap: 10px; margin-top: 10px; }
  button {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    border-radius: 12px;
    cursor: pointer;
  }
  #buscar { background: var(--acento); color: #fff; border: none; }
  #reenviar { background: transparent; color: var(--acento); border: 1px solid var(--acento); }

  #status { min-height: 1.4em; font-size: 0.9rem; color: var(--suave); margin: 0 0 16px 4px; }

  #lista { display: grid; gap: 10px; }
  .livro {
    background: var(--card);
    border: 1px solid var(--borda);
    border-left: 4px solid var(--acento);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .livro strong { font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
  .livro small { display: block; color: var(--suave); margin-top: 2px; }
  .vazio { color: var(--suave); text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>Minha biblioteca</h1>
  <p class="subtitulo">Cada país pintado é de onde veio pelo menos um dos seus autores.</p>

  <div class="resumo">
    <div><strong id="totalLivros">0</strong><span>livros</span></div>
    <div><strong id="totalPaises">0</strong><span>países lidos</span></div>
  </div>

  <div id="mapa"></div>

  <section class="busca">
    <input id="isbnInput" type="text" inputmode="numeric" placeholder="ISBN (10 ou 13 dígitos)">
    <div class="botoes">
      <button id="buscar">Buscar e cadastrar</button>
      <button id="reenviar">Enviar pendentes</button>
    </div>
  </section>

  <p id="status"></p>
  <div id="lista"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Cole aqui o URL do app da web do Apps Script
const URL_PLANILHA = 'https://script.google.com/macros/s/AKfycbxlXyIy31p9__EvJ2pEwPRyuA2y-TDw_rHyMOsONiMC-Kj5PSe10j8ss7Ws8zHIaCdmLA/exec';

// Fronteiras dos países (GeoJSON público)
const URL_PAISES = 'https://cdn.jsdelivr.net/gh/datasets/geo-countries@master/data/countries.geojson';

const statusEl = document.getElementById('status');
const lista = document.getElementById('lista');
const campo = document.getElementById('isbnInput');
let catalogo = JSON.parse(localStorage.getItem('catalogo') || '[]');

// ---------- ISBN ----------

function isbn13Valido(isbn) {
  if (!/^\d{13}$/.test(isbn)) return false;
  let soma = 0;
  for (let i = 0; i < 12; i++) soma += Number(isbn[i]) * (i % 2 === 0 ? 1 : 3);
  return (10 - (soma % 10)) % 10 === Number(isbn[12]);
}

function isbn10Para13(isbn9) {
  const base = '978' + isbn9;
  let soma = 0;
  for (let i = 0; i < 12; i++) soma += Number(base[i]) * (i % 2 === 0 ? 1 : 3);
  return base + ((10 - (soma % 10)) % 10);
}

function paisDaEditora(isbn) {
  const prefixos = [
    ['97885', 'Brasil'], ['97865', 'Brasil'],
    ['978972', 'Portugal'], ['978989', 'Portugal'],
    ['97884', 'Espanha'], ['97888', 'Itália'],
    ['9782', 'França'], ['9783', 'Alemanha'],
    ['9784', 'Japão'], ['9787', 'China']
  ];
  for (const [prefixo, pais] of prefixos) {
    if (isbn.startsWith(prefixo)) return pais;
  }
  return '';
}

// ---------- Nome do país -> código ISO ----------

const LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function normalizar(texto) {
  return (texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

const nomeParaIso = {};
(function montarDicionario() {
  // Nomes oficiais em português e inglês, gerados pelo próprio navegador
  for (const idioma of ['pt', 'en']) {
    const dn = new Intl.DisplayNames([idioma], { type: 'region' });
    for (const a of LETRAS) {
      for (const b of LETRAS) {
        const codigo = a + b;
        const nome = dn.of(codigo);
        if (nome && nome !== codigo) nomeParaIso[normalizar(nome)] = codigo;
      }
    }
  }
  // Apelidos comuns em nomes de autores e de mapas
  Object.assign(nomeParaIso, {
    'eua': 'US', 'usa': 'US', 'estados unidos da america': 'US',
    'united states': 'US', 'united states of america': 'US',
    'inglaterra': 'GB', 'escocia': 'GB', 'pais de gales': 'GB', 'irlanda do norte': 'GB',
    'england': 'GB', 'scotland': 'GB', 'wales': 'GB', 'northern ireland': 'GB',
    'coreia do sul': 'KR', 'coreia do norte': 'KP', 'republic of korea': 'KR',
    'south korea': 'KR', 'north korea': 'KP',
    'russia': 'RU', 'federacao russa': 'RU', 'siria': 'SY', 'turquia': 'TR', 'turkiye': 'TR',
    'republica tcheca': 'CZ', 'czechia': 'CZ', 'vietna': 'VN',
    'tanzania': 'TZ', 'republica democratica do congo': 'CD',
    'democratic republic of the congo': 'CD', 'birmania': 'MM',
    'macedonia do norte': 'MK', 'north macedonia': 'MK', 'eslovaquia': 'SK',
    'ira': 'IR', 'iran': 'IR', 'bolivia': 'BO', 'venezuela': 'VE'
  });
})();

function isoDoNome(nome) {
  return nomeParaIso[normalizar(nome)] || null;
}

// Descobre o código ISO de uma feature do mapa: tenta o código, depois os nomes
function isoDaFeature(feature) {
  const p = feature.properties || {};
  for (const valor of Object.values(p)) {
    if (typeof valor === 'string' && /^[A-Z]{2}$/.test(valor)) return valor;
  }
  for (const valor of Object.values(p)) {
    if (typeof valor === 'string') {
      const iso = isoDoNome(valor);
      if (iso) return iso;
    }
  }
  return null;
}

// ---------- Busca do livro ----------

async function buscarLivro(isbn) {
  try {
    const r = await fetch(`https://brasilapi.com.br/api/isbn/v1/${isbn}`);
    if (r.ok) {
      const info = await r.json();
      return {
        isbn,
        titulo: info.title || '',
        autores: (info.authors || []).join(', '),
        editora: info.publisher || '',
        ano: String(info.year || ''),
        paginas: info.page_count || ''
      };
    }
  } catch (e) { /* tenta a próxima fonte */ }

  try {
    const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    if (r.ok) {
      const dados = await r.json();
      const info = dados[`ISBN:${isbn}`];
      if (info) {
        return {
          isbn,
          titulo: info.title || '',
          autores: (info.authors || []).map(a => a.name).join(', '),
          editora: (info.publishers || []).map(p => p.name).join(', '),
          ano: ((info.publish_date || '').match(/\d{4}/) || [''])[0],
          paginas: info.number_of_pages || ''
        };
      }
    }
  } catch (e) { /* nada encontrado */ }

  return null;
}

// ---------- País do autor (Wikidata) ----------

async function consultaWikidata(url) {
  return (await fetch(url + '&origin=*')).json();
}

async function entidade(id, props) {
  const dados = await consultaWikidata(
    `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${id}&props=${props}&languages=pt|en&format=json`
  );
  return dados.entities[id];
}

function rotulo(entidadeWikidata) {
  const l = entidadeWikidata.labels || {};
  return (l.pt || l.en || {}).value || '';
}

async function paisDoAutor(nome) {
  if (!nome) return '';
  try {
    const busca = await consultaWikidata(
      `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(nome)}&language=en&type=item&limit=5&format=json`
    );
    for (const item of busca.search || []) {
      const autor = await entidade(item.id, 'claims');
      const claims = autor.claims || {};
      if (!claims.P27 && !claims.P19) continue;

      if (claims.P19) {
        const lugar = await entidade(claims.P19[0].mainsnak.datavalue.value.id, 'claims');
        if (lugar.claims?.P17) {
          const idPais = lugar.claims.P17[0].mainsnak.datavalue.value.id;
          const nomePais = rotulo(await entidade(idPais, 'labels'));
          if (nomePais) return nomePais;
        }
      }
      if (claims.P27) {
        const idPais = claims.P27[0].mainsnak.datavalue.value.id;
        return rotulo(await entidade(idPais, 'labels'));
      }
    }
  } catch (e) { /* sem resultado */ }
  return '';
}

// Livros antigos podem ter o país em outros campos; usa o que existir
function paisDoLivro(l) {
  return l.paisAutor || l.paisNascimento || l.paisCidadania || '';
}

// Completa o país de livros que ainda não o têm (sem reenviar para a planilha)
async function completarPaises() {
  let mudou = false;
  for (const livro of catalogo) {
    if (paisDoLivro(livro)) {
      if (!livro.paisAutor) { livro.paisAutor = paisDoLivro(livro); mudou = true; }
      continue;
    }
    if (livro.paisBuscado) continue;
    livro.paisAutor = await paisDoAutor((livro.autores || '').split(',')[0].trim());
    livro.paisBuscado = true;
    mudou = true;
  }
  if (mudou) {
    localStorage.setItem('catalogo', JSON.stringify(catalogo));
    atualizarTela();
  }
}

// ---------- Mapa ----------

const mapa = L.map('mapa', { minZoom: 1, worldCopyJump: true }).setView([20, 0], 2);
let camadaPaises = null;

// Código ISO -> títulos de livros daquele país
function titulosPorIso() {
  const mapaIso = {};
  for (const livro of catalogo) {
    const iso = isoDoNome(paisDoLivro(livro));
    if (!iso) continue;
    (mapaIso[iso] = mapaIso[iso] || []).push(livro.titulo);
  }
  return mapaIso;
}

function estiloPais(feature) {
  const lidos = titulosPorIso();
  const iso = isoDaFeature(feature);
  const lido = iso && lidos[iso];
  return {
    fillColor: lido ? '#9c4a2f' : '#e9e2d4',
    fillOpacity: lido ? 0.85 : 0.6,
    color: '#b9ae9a',
    weight: 0.6
  };
}

async function carregarMapa() {
  try {
    const geo = await (await fetch(URL_PAISES)).json();
    camadaPaises = L.geoJSON(geo, {
      style: estiloPais,
      onEachFeature: (feature, layer) => {
        layer.bindTooltip(() => {
          const iso = isoDaFeature(feature);
          const livros = (iso && titulosPorIso()[iso]) || [];
          const nome = feature.properties.name || feature.properties.ADMIN || iso;
          if (!livros.length) return nome;
          return `<strong>${nome}</strong><br>${livros.join('<br>')}`;
        });
      }
    }).addTo(mapa);
  } catch (e) {
    statusEl.textContent = 'Não consegui carregar o mapa. Verifique a conexão.';
  }
}

function atualizarMapa() {
  if (camadaPaises) camadaPaises.setStyle(estiloPais);
}

// ---------- Lista e resumo ----------

function atualizarResumo() {
  document.getElementById('totalLivros').textContent = catalogo.length;
  const paises = new Set(catalogo.map(l => isoDoNome(paisDoLivro(l))).filter(Boolean));
  document.getElementById('totalPaises').textContent = paises.size;
}

function mostrarLista() {
  lista.innerHTML = '';
  atualizarResumo();

  if (!catalogo.length) {
    const p = document.createElement('p');
    p.className = 'vazio';
    p.textContent = 'Nenhum livro cadastrado ainda.';
    lista.appendChild(p);
    return;
  }

  catalogo.slice().reverse().forEach(l => {
    const div = document.createElement('div');
    div.className = 'livro';
    const titulo = document.createElement('strong');
    titulo.textContent = l.titulo;
    const detalhe = document.createElement('small');
    detalhe.textContent = [l.autores, paisDoLivro(l), l.ano].filter(Boolean).join(' · ');
    div.append(titulo, detalhe);
    lista.appendChild(div);
  });
}

function atualizarTela() {
  mostrarLista();
  atualizarMapa();
}

// ---------- Planilha ----------

async function enviarParaPlanilha(livro) {
  try {
    await fetch(URL_PLANILHA, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(livro)
    });
  } catch (e) {
    console.error('Falha ao enviar para a planilha', e);
  }
}

// ---------- Fluxo principal ----------

async function processarIsbn(isbn) {
  if (!isbn13Valido(isbn)) {
    statusEl.textContent = 'ISBN inválido. Confira os dígitos.';
    return;
  }
  if (catalogo.some(l => l.isbn === isbn)) {
    statusEl.textContent = 'Este livro já está no catálogo.';
    return;
  }

  statusEl.textContent = `Buscando ${isbn}...`;
  const livro = await buscarLivro(isbn);

  if (!livro) {
    statusEl.textContent = `ISBN ${isbn} não encontrado nas bases consultadas.`;
    return;
  }

  statusEl.textContent = 'Buscando país do autor...';
  livro.paisAutor = await paisDoAutor(livro.autores.split(',')[0].trim());
  livro.paisBuscado = true;
  livro.paisPublicacao = paisDaEditora(isbn);

  await enviarParaPlanilha(livro);
  livro.enviado = true;

  catalogo.push(livro);
  localStorage.setItem('catalogo', JSON.stringify(catalogo));
  statusEl.textContent = `Cadastrado: ${livro.titulo}`;
  atualizarTela();
}

function cadastrarDigitado() {
  let isbn = campo.value.replace(/[^0-9Xx]/g, '').toUpperCase();
  if (isbn.length === 10) isbn = isbn10Para13(isbn.slice(0, 9));
  campo.value = '';
  processarIsbn(isbn);
}

document.getElementById('buscar').onclick = cadastrarDigitado;
campo.addEventListener('keydown', e => {
  if (e.key === 'Enter') cadastrarDigitado();
});

document.getElementById('reenviar').onclick = async () => {
  const pendentes = catalogo.filter(l => !l.enviado);
  if (!pendentes.length) {
    statusEl.textContent = 'Nenhum livro pendente.';
    return;
  }
  statusEl.textContent = `Enviando ${pendentes.length} livro(s)...`;
  for (const livro of pendentes) {
    await enviarParaPlanilha(livro);
    livro.enviado = true;
    localStorage.setItem('catalogo', JSON.stringify(catalogo));
    await new Promise(r => setTimeout(r, 500));
  }
  statusEl.textContent = 'Envio concluído. Confira a planilha.';
};

// Inicialização: carrega o mapa, mostra a lista e completa países antigos
carregarMapa().then(() => {
  atualizarTela();
  completarPaises();
});
</script>
</body>
</html>
